id: com.visualstudio.code.tool.podman
branch: '25.08'
build-extension: true
sdk: org.freedesktop.Sdk//25.08
runtime: com.visualstudio.code
runtime-version: stable
separate-locales: false
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
build-options:
  append-path: /usr/lib/sdk/golang/bin
  prefix: /app/tools/podman
  strip: true
cleanup:
  - '*.a'
  - '*.la'
  - /share/man
modules:
  - name: podman
    buildsystem: simple
    build-commands:
      - make PREFIX=${FLATPAK_DEST} podman-remote
      - install -Dm755 bin/podman-remote -t ${FLATPAK_DEST}/bin/
      - make PREFIX=${FLATPAK_DEST} podman
      - install -Dm755 bin/podman -t ${FLATPAK_DEST}/bin/
    sources:
      - type: git
        url: https://github.com/containers/podman.git
        tag: v5.8.1
        commit: c6077f645788743258a1a749f8005b4fb3cbe533
        x-checker-data:
          type: json
          url: https://api.github.com/repos/containers/podman/releases/latest
          tag-query: .tag_name
          timestamp-query: .published_at
          version-query: $tag | sub("^v"; "")

  - name: podman_compose
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-index --no-build-isolation --find-links=. .
    sources:
      - type: git
        url: https://github.com/bam80/podman-compose.git
        branch: patch-1
      - type: file
        url: https://files.pythonhosted.org/packages/0b/d7/1959b9648791274998a9c3526f6d0ec8fd2233e4d4acce81bbae76b44b2a/python_dotenv-1.2.2-py3-none-any.whl
        sha256: 1d8214789a24de455a8b8bd8ae6fe3c6b69a5e3d64aa8a8e5d68e694bbcb285a
      - type: file
        url: https://files.pythonhosted.org/packages/05/8e/961c0007c59b8dd7729d542c61a4d537767a59645b82a0b521206e1e25c2/pyyaml-6.0.3.tar.gz
        sha256: d76623373421df22fb4cf8817020cbb7ef15c725b9d5e45f17e189bfc384190f

  - name: bundle-setup
    buildsystem: simple
    build-commands:
      - install -Dm644 -t $FLATPAK_DEST/share/metainfo $FLATPAK_ID.metainfo.xml
    sources:
      - type: file
        path: com.visualstudio.code.tool.podman.metainfo.xml
