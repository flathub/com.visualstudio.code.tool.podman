name: Check for updates

on:
  schedule:
    - cron: "0 0 * * *" # daily, at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Scheduled and manual runs must not update the same PR concurrently.
concurrency:
  group: podman-source-updates
  cancel-in-progress: false

jobs:
  flatpak-external-data-checker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # master builds the 26.08 extension. Keep 24.08 as historical only.
        branch: [master, branch/25.08]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      # --edit-only checks this checkout, bypassing the checker's automatic
      # branch/* traversal. Publishing is handled below with one PR per base.
      - uses: docker://ghcr.io/flathub-infra/flatpak-external-data-checker:latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --edit-only com.visualstudio.code.tool.podman.yml

      - name: Read the updated version
        id: version
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          release = ET.parse("com.visualstudio.code.tool.podman.metainfo.xml").find("releases/release")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={release.attrib['version']}", file=output)
          PY

      - name: Create or update the source update PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          base: ${{ matrix.branch }}
          branch: automation/podman-${{ matrix.branch }}
          delete-branch: true
          add-paths: |
            com.visualstudio.code.tool.podman.yml
            com.visualstudio.code.tool.podman.metainfo.xml
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "podman: Update to ${{ steps.version.outputs.version }}"
          title: "[${{ matrix.branch }}] podman: Update to ${{ steps.version.outputs.version }}"
          body: |
            Update Podman sources and release metadata with Flatpak External Data Checker.

            This PR is refreshed in place when a newer release is available.
            Runtime and SDK settings stay on the target branch.

            If Flathub has paused automatic test builds due to inactivity,
            comment `bot, build` on this PR before merging.

            [View checker logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
